<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AGRIAUTO · Gestión de Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #f0f0ec; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
input:focus, textarea:focus { border-color: #3a9e3f !important; box-shadow: 0 0 0 3px rgba(58,158,63,0.12) !important; }
.card-drag { opacity: 0.4; transform: scale(0.97); }
.mobile-col-nav { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
@media (max-width: 640px) {
  .mobile-col-nav { display: flex !important; }
  .board-grid { display: block !important; padding: 8px !important; }
  .col-item { display: none !important; }
  .col-item.col-active { display: flex !important; }
  .header-title-sub { display: none; }
}
</style>
</head>
